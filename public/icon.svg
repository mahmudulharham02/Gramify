<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Stylized G and Book Emblem -->
  <g transform="translate(106, 106)">
    <!-- Subtle glow background circle -->
    <circle cx="150" cy="150" r="130" fill="url(#cyanGrad)" opacity="0.15" filter="url(#glow)" />
    
    <!-- Open Book / Wing Motif -->
    <path d="M 30 200 C 70 175, 120 180, 150 195 C 180 180, 230 175, 270 200 L 270 130 C 230 105, 180 110, 150 125 C 120 110, 70 105, 30 130 Z" fill="url(#cyanGrad)" opacity="0.85" />
    
    <!-- Stylized Modern Letter G with Lightning/Quill accent -->
    <path d="M 150 50 C 85 50, 42 98, 42 165 C 42 232, 88 275, 158 275 C 220 275, 252 238, 255 185 L 152 185 L 152 152 L 288 152 C 290 162, 292 174, 292 186 C 292 258, 236 308, 155 308 C 65 308, 8 245, 8 165 C 8 85, 68 18, 155 18 C 205 18, 248 36, 275 68 L 246 95 C 224 70, 192 50, 150 50 Z" fill="url(#accentGrad)" />
    
    <!-- Academic Star Accent -->
    <polygon points="250,45 256,62 274,62 260,73 265,90 250,80 235,90 240,73 226,62 244,62" fill="#38bdf8" />
  </g>
</svg>
